# Ganancias del control, aplicadas al arrancar controlador_sim. Los valores por
# defecto del código son los del firmware (src/config.h); este fichero permite
# sintonizar en simulación sin reinstalar el paquete:
#
#   ros2 launch dron_simulation simulacion.launch.py
#   # editar este fichero y relanzar, o en caliente:
#   ros2 param set /controlador_sim kp_vel_z 6.0
#
# Cuando una combinación funcione, hay que pasarla a src/config.h del firmware:
# la simulación solo vale como banco de pruebas mientras las dos coincidan.
controlador_sim:
  ros__parameters:
    # --- actitud: lazo externo de ángulo y lazo interno de velocidad angular ---
    kp_ang: 4.5        # deg/s por grado de error
    kp_rate: 0.0020    # throttle por deg/s
    ki_rate: 0.0040
    kd_rate: 0.00006
    kp_yaw: 0.0040
    ki_yaw: 0.0060

    # --- altura: cascada posición -> velocidad (Lab_rav_03) ---
    kp_pos_z: 1.0      # m/s por metro de error
    kd_pos_z: 0.2
    kp_vel_z: 5.0      # m/s^2 por m/s de error
    ki_vel_z: 1.0      # absorbe el error de estimación de THROTTLE_HOVER
    kd_vel_z: 1.0
