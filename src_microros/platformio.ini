; Firmware del dron para ESP32-S3-DevKitC-1.
;   pio run -e serie -t upload    micro-ROS por el puerto USB marcado UART
;   pio run -e wifi  -t upload    micro-ROS por WiFi (red y agente en src/config.h)
;
; espressif32 6.x trae arduino-esp32 2.x: motores.cpp usa ledcSetup/ledcAttachPin,
; que ya no existen en la 3.x.

[platformio]
default_envs = serie

[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_microros_distro = humble
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio#cfee17f
    wollewald/MPU9250_WE@1.2.17
    robtillaart/MS5611@0.5.2
    adafruit/Adafruit_VL53L0X@1.2.5

[env:serie]
board_microros_transport = serial

[env:wifi]
board_microros_transport = wifi
